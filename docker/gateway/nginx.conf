worker_processes 1;
# 保留环境变量供 Lua (access_by_lua_block) 读取 -> admin 控制台来源白名单
env PERSEUS_ADMIN_ALLOWED_SOURCES;
events { worker_connections 1024; }
http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    # 让 admin 白名单拒绝的 WARN 日志可见（默认 error 级别会吞掉 warn）
    error_log /dev/stderr warn;

    map $http_origin $cors_origin {
        default $http_origin;
    }

    # Docker 内置 DNS：运行时动态解析服务名，容器重启/IP 变化后不缓存旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8000;
        server_name _;

        # 使用变量绕过 nginx 启动时的静态 DNS 解析
        set $git_cgi_backend perseus-git-cgi:9000;
        set $app_backend http://app:8000;
        set $collab_backend http://collab:4444;
        set $grafana_backend http://grafana:3000;

        # 前端静态文件根目录
        root /var/www/perseus-web;
        index index.html;

        more_set_headers "Access-Control-Allow-Origin: $cors_origin";
        more_set_headers "Access-Control-Allow-Methods: GET, POST, PUT, DELETE, PATCH, OPTIONS";
        more_set_headers "Access-Control-Allow-Headers: Content-Type, Authorization, X-Requested-With";
        more_set_headers "Access-Control-Allow-Credentials: true";
        more_set_headers "Access-Control-Max-Age: 600";

        # ── Git HTTP Smart Protocol ──
        location ~ ^/(?<git_owner>[^/]+)/(?<git_repo>[^/]+\.git)(/.*)?$ {
            auth_request /git-auth;

            fastcgi_pass $git_cgi_backend;
            fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param GIT_PROJECT_ROOT /data/repositories;
            fastcgi_param GIT_HTTP_EXPORT_ALL "1";
            fastcgi_param REMOTE_USER $remote_user;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param SERVER_NAME $host;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_read_timeout 300s;
        }

        # Git 认证子请求
        # 直接使用内置 $request_uri / $http_authorization: 它们在子请求中
        # 始终指向客户端原始请求, 不受 auth_request 子请求求值时机影响
        location = /git-auth {
            internal;
            proxy_pass $app_backend/api/v1/git-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Git-Request-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── 协作编辑 Yjs 网关 (Hocuspocus) ──
        # 正则 location 按顺序首配即停: 必须位于下方 /ws 通配之前
        location ~ ^/ws/collab {
            proxy_pass $collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # 协作长连接
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Admin 控制台 API（来源白名单）──
        # 仅允许 PERSEUS_ADMIN_ALLOWED_SOURCES 中列出的部署终端来源访问。
        # 白名单实现抽为 admin_acl.lua（/api/app/* 与 /grafana/* 复用）；由
        # compose 挂载到 /etc/nginx/admin_acl.lua。留空 = 拒绝一切（安全优先）。
        location ^~ /api/app/ {
            if ($request_method = OPTIONS) {
                return 204;
            }
            access_by_lua_file /etc/nginx/admin_acl.lua;
            proxy_pass $app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Grafana 子路径反代（同源 SSO）──
        # 浏览器经 /grafana 访问部署机 Grafana（仅授权来源）；app 通过
        # /api/app/monitoring/grafana/sso 下发 Path=/grafana 的会话 Cookie。
        # Grafana 端以 serve_from_sub_path 处理 /grafana 前缀，此处不剥离路径。
        location = /grafana {
            return 302 /grafana/;
        }
        location ^~ /grafana/ {
            access_by_lua_file /etc/nginx/admin_acl.lua;
            proxy_pass $grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ── API 代理 ──
        location ~ ^/(api|health|docs|openapi.json|redoc|ws) {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass $app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 静态资源（带缓存）──
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA 前端（所有其他路径 → index.html）──
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
