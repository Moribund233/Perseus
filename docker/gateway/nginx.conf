worker_processes 1;
events { worker_connections 1024; }
http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    map $http_origin $cors_origin {
        default $http_origin;
    }

    upstream git_backend {
        server perseus-git-cgi:9000;
    }

    server {
        listen 8000;
        server_name _;

        # 前端静态文件根目录
        root /var/www/perseus-web;
        index index.html;

        more_set_headers "Access-Control-Allow-Origin: $cors_origin";
        more_set_headers "Access-Control-Allow-Methods: GET, POST, PUT, DELETE, PATCH, OPTIONS";
        more_set_headers "Access-Control-Allow-Headers: Content-Type, Authorization, X-Requested-With";
        more_set_headers "Access-Control-Allow-Credentials: true";
        more_set_headers "Access-Control-Max-Age: 600";

        # ── Git HTTP Smart Protocol ──
        location ~ ^/(?<git_owner>[^/]+)/(?<git_repo>[^/]+\.git)(/.*)?$ {
            set $original_git_uri $uri$is_args$args;
            set $git_auth_header $http_authorization;

            auth_request /git-auth;

            fastcgi_pass git_backend;
            fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param GIT_PROJECT_ROOT /data/repositories;
            fastcgi_param GIT_HTTP_EXPORT_ALL "1";
            fastcgi_param REMOTE_USER $remote_user;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param SERVER_NAME $host;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_read_timeout 300s;
        }

        # Git 认证子请求
        location = /git-auth {
            internal;
            proxy_pass http://app:8000/api/v1/git-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Git-Request-URI $original_git_uri;
            proxy_set_header Authorization $git_auth_header;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── API 代理 ──
        location ~ ^/(api|health|docs|openapi.json|redoc|ws) {
            if ($request_method = OPTIONS) {
                return 204;
            }
            proxy_pass http://app:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 静态资源（带缓存）──
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA 前端（所有其他路径 → index.html）──
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
