# Perseus 开发环境反向代理配置 (1Panel OpenResty)
#
# 放置位置: /www/sites/perseus/proxy/perseus.conf

# ---- API 代理（含登录等所有 REST 请求） ----
location ^~ /api/ {
    # CORS 预检
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Git-Request-URI' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' '86400' always;
        add_header 'Content-Length' 0;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        return 204;
    }

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-Git-Request-URI' always;

    proxy_pass http://127.0.0.1:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# ---- WebSocket 代理 ----
location ^~ /ws/ {
    proxy_pass http://127.0.0.1:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ---- Git HTTP Smart Protocol (FastCGI → fcgiwrap → git-http-backend) ----
location ~ ^/[a-zA-Z0-9_-]+/[a-zA-Z0-9_\-\.]+\.git(/.*)?$ {
    access_by_lua_block {
        local res = ngx.location.capture("/api/v1/git-auth", {
            method = ngx.HTTP_GET,
            headers = {
                ["X-Git-Request-URI"] = ngx.var.request_uri,
                ["Authorization"] = ngx.req.get_headers()["Authorization"],
                ["Content-Type"] = "",
            },
            body = "",
        })
        if res.status ~= 200 then
            if res.header["www-authenticate"] then
                ngx.header["WWW-Authenticate"] = res.header["www-authenticate"]
            end
            ngx.exit(res.status)
        end
    }

    gzip off;
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
    fastcgi_param GIT_PROJECT_ROOT /data/repositories;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param GIT_HTTP_EXPORT_ALL "";
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    client_max_body_size 0;
}

# ---- 前端 (Vite) ----
location / {
    proxy_pass http://127.0.0.1:5173/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
}

# ---- 健康检查 ----
location ^~ /health {
    proxy_pass http://127.0.0.1:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
}

# ---- API 文档 ----
location ^~ /docs {
    proxy_pass http://127.0.0.1:8000/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location ^~ /openapi.json {
    proxy_pass http://127.0.0.1:8000/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location ^~ /redoc {
    proxy_pass http://127.0.0.1:8000/redoc;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
