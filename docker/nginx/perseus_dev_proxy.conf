# =============================================================================
# Perseus 开发环境反向代理配置
# 适用于 1Panel OpenResty
#
# 放置位置: /www/sites/perseus_dev/proxy/perseus.conf
# 包含: API、WebSocket、Git HTTP Smart Protocol
# =============================================================================

# ----------------------------------------
# API 代理 - FastAPI 后端
# ----------------------------------------
location ^~ /api/ {
    proxy_pass http://172.21.0.2:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# ----------------------------------------
# WebSocket 代理
# ----------------------------------------
location ^~ /ws/ {
    proxy_pass http://172.21.0.2:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ----------------------------------------
# Git HTTP Smart Protocol 代理
# 路径格式: /{username}/{repo}.git
# ----------------------------------------
location ~ ^/[a-zA-Z0-9_-]+/[a-zA-Z0-9_\-\.]+\.git(/.*)?$ {
    # Git 智能 HTTP 协议需要特殊的请求处理
    # 转发到 git-http-backend (FastCGI 端口 9000)
    proxy_pass http://127.0.0.1:9000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Git 协议特定的超时设置
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 支持大文件传输
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    # Git 特定的 HTTP 头
    proxy_set_header Content-Type "";
}

# ----------------------------------------
# 前端开发服务器代理 (Vite)
# 开发环境: http://localhost:5173
# 注意: OpenResty 使用 host 网络模式，可以直接访问 Windows localhost
# Windows 主机 IP 可以通过 host.docker.internal 解析，但在 host 网络模式下需要特殊处理
# 这里使用 127.0.0.1 指向 WSL2 主机，前端需要在 WSL2 中运行或通过其他方式暴露
# ----------------------------------------
location ^~ / {
    # 尝试多种方式访问前端开发服务器
    # 方式1: 如果前端在 WSL2 中运行，使用 127.0.0.1
    # 方式2: 如果前端在 Windows 上运行，需要知道 Windows 主机的 IP
    # 这里默认使用 127.0.0.1，如需访问 Windows 上的前端，请修改为 Windows 主机 IP
    proxy_pass http://127.0.0.1:5173/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Vite HMR (热重载) WebSocket 支持
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
}

# ----------------------------------------
# 健康检查端点
# ----------------------------------------
location ^~ /health {
    proxy_pass http://172.21.0.2:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
}
