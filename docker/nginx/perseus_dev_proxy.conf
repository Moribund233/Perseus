# =============================================================================
# Perseus 开发环境反向代理配置
# 适用于 1Panel OpenResty
#
# 放置位置: /www/sites/perseus/proxy/perseus.conf
# 包含: API、WebSocket、Git HTTP Smart Protocol、前端开发服务器
#
# 网络说明:
#   OpenResty 容器使用 host 网络模式，故 127.0.0.1 指向宿主机。
#   后端 FastAPI 暴露端口 8000，git-cgi fcgiwrap 暴露端口 9000。
# =============================================================================

# ----------------------------------------
# API 代理 - FastAPI 后端
# ----------------------------------------
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# ----------------------------------------
# WebSocket 代理
# ----------------------------------------
location ^~ /ws/ {
    proxy_pass http://127.0.0.1:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# ----------------------------------------
# Git HTTP Smart Protocol 代理
# 路径格式: /{username}/{repo}.git
# fcgiwrap 监听 TCP 9000，需用 fastcgi_pass
# ----------------------------------------
location ~ ^/[a-zA-Z0-9_-]+/[a-zA-Z0-9_\-\.]+\.git(/.*)?$ {
    gzip off;

    # -- Smart Protocol: clone/fetch --
    location ~ \.git/(info/refs|git-upload-pack)$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT /data/repositories;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # -- Smart Protocol: push --
    location ~ \.git/git-receive-pack$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_PROJECT_ROOT /data/repositories;
        fastcgi_param PATH_INFO $uri;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param REMOTE_USER $remote_user;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    # -- Dumb HTTP 协议后备 --
    location ~ \.git/(HEAD|objects/|refs/) {
        root /data/repositories;
    }
}

# ----------------------------------------
# 前端开发服务器代理 (Vite)
# 开发环境: http://localhost:5173
# 使用普通 location /（无修饰符），优先级低于 ^~ 和 ~
# ----------------------------------------
location / {
    proxy_pass http://127.0.0.1:5173/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Vite HMR (热重载) WebSocket 支持
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 86400s;
}

# ----------------------------------------
# 健康检查端点
# ----------------------------------------
location ^~ /health {
    proxy_pass http://127.0.0.1:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
}

# ----------------------------------------
# API 文档（Swagger UI / OpenAPI JSON）
# FastAPI 自带的 /docs 和 /openapi.json 在根路径
# ----------------------------------------
location ^~ /docs {
    proxy_pass http://127.0.0.1:8000/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /openapi.json {
    proxy_pass http://127.0.0.1:8000/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ----------------------------------------
# Redoc API 文档
# ----------------------------------------
location ^~ /redoc {
    proxy_pass http://127.0.0.1:8000/redoc;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
