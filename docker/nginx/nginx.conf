# =============================================================================
# Perseus Nginx 配置
#
# 架构说明：
#   1. Git HTTP Smart Protocol → git-cgi 容器 (fcgiwrap + git-http-backend)
#   2. API/WebSocket 请求 → FastAPI 后端
#   3. 静态文件 → Nginx 直接服务
#
# 容器间通信：
#   Nginx (fastcgi) → git-cgi:9000 (fcgiwrap TCP)
#   Nginx (proxy)   → app:8000     (FastAPI)
#
# 使用 docker-compose 启动时，此配置被挂载到 Nginx 容器。
# =============================================================================

upstream fastapi_backend {
    server app:8000;
}

upstream git_cgi_backend {
    server git-cgi:9000;
}

# =============================================
# 速率限制（限流）配置
# =============================================

# ---- 限速区域定义 ----
# $binary_remote_addr 以客户端 IP 为粒度
# 共享内存大小决定能同时追踪多少 IP（1MB ≈ 16,000 IP）

# 通用 API 请求限速（每个 IP 每秒 60 次请求，突发 100）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

# 登录认证限速（每个 IP 每分钟 10 次，防止暴力破解）
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# Git 克隆/拉取限速（每个 IP 每分钟 30 次，防止大量 clone 耗尽带宽）
limit_req_zone $binary_remote_addr zone=git_clone_limit:10m rate=30r/m;

# Git 推送限速（每个 IP 每分钟 6 次，推送更重且频率更低）
limit_req_zone $binary_remote_addr zone=git_push_limit:10m rate=6r/m;

# ---- 并发连接限制区域 ----
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;

    # 请求体大小限制（允许大文件推送）
    client_max_body_size 500M;

    # ---- 全局连接限制 ----
    # 每个 IP 最多 50 个并发连接
    limit_conn conn_limit 50;

    # =============================================
    # Git HTTP Smart Protocol
    # =============================================
    # 匹配 /username/repo.git/... 格式的 Git 请求
    location ~ ^/(?<username>[^/]+)/(?<reponame>[^/]+)\.git/ {
        # 禁用 gzip（Git 协议自己处理压缩）
        gzip off;

        # ---- Smart Protocol: clone/fetch ----
        # info/refs: 通告引用（clone 和 push 的第一步）
        # git-upload-pack: 客户端拉取数据
        location ~ \.git/(info/refs|git-upload-pack)$ {
            include fastcgi_params;

            fastcgi_pass git_cgi_backend;

            # CGI 程序路径
            fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;

            # Git 环境变量
            fastcgi_param GIT_PROJECT_ROOT $git_root;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param REMOTE_USER $remote_user;

            # 超时配置（大仓库需要更长超时）
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;

            # 克隆限速：每分钟 30 次，突发 5 次
            limit_req zone=git_clone_limit burst=5 nodelay;
        }

        # ---- Smart Protocol: push ----
        # git-receive-pack: 客户端推送数据（写入操作，限速更严格）
        location ~ \.git/git-receive-pack$ {
            include fastcgi_params;

            fastcgi_pass git_cgi_backend;

            fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;

            fastcgi_param GIT_PROJECT_ROOT $git_root;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param REMOTE_USER $remote_user;

            # 推送超时更长（大仓库推送可能需要更长时间）
            fastcgi_read_timeout 600s;
            fastcgi_send_timeout 600s;

            # 推送限速：每分钟 6 次，突发 2 次
            limit_req zone=git_push_limit burst=2 nodelay;
        }

        # ---- Dumb HTTP 协议后备 ----
        # 用于不支持 Smart Protocol 的旧 Git 客户端
        location ~ \.git/(HEAD|objects/|refs/) {
            root $git_root;
        }
    }

    # =============================================
    # 登录限速（防暴力破解，独立于通用 API）
    # =============================================
    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=3 nodelay;

        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =============================================
    # API 请求（反向代理到 FastAPI）
    # =============================================
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # 通用 API 限速：每秒 60 次，突发 10 次
        limit_req zone=api_limit burst=10 nodelay;
    }

    # =============================================
    # WebSocket 端点
    # =============================================
    location /ws {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # =============================================
    # 健康检查
    # =============================================
    location /health {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }
}
