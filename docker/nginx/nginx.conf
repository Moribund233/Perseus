# =============================================================================
# Perseus Nginx 配置
#
# 架构说明：
#   1. Git HTTP Smart Protocol → git-http-backend (CGI via fcgiwrap)
#   2. API/WebSocket 请求 → FastAPI 后端
#   3. 静态文件 → Nginx 直接服务
#
# 依赖:
#   - fcgiwrap: 将 CGI 请求转发给 git-http-backend
#   - git: 提供 git-http-backend 可执行文件
#
# 使用 docker-compose 启动时，此配置被挂载到 Nginx 容器。
# =============================================================================

upstream fastapi_backend {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # 请求体大小限制（允许大文件推送）
    client_max_body_size 500M;

    # =============================================
    # Git HTTP Smart Protocol
    # =============================================
    # 匹配 /username/repo.git/... 格式的 Git 请求
    location ~ ^/(?<username>[^/]+)/(?<reponame>[^/]+)\.git/ {
        # 禁用 gzip（Git 协议自己处理压缩）
        gzip off;

        # Git 仓库根目录（所有 bare 仓库的父目录）
        set $git_root /data/repositories;

        # 智能协议请求转发到 git-http-backend
        location ~ \.(git|info/refs|git-upload-pack|git-receive-pack)$ {
            include fastcgi_params;

            fastcgi_pass unix:/var/run/fcgiwrap.socket;

            # CGI 程序路径
            fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;

            # Git 环境变量
            fastcgi_param GIT_PROJECT_ROOT $git_root;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param REMOTE_USER $remote_user;

            # 超时配置（大仓库需要更长超时）
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
        }

        # 静态文件（dumb HTTP 协议的后备）
        location ~ \.(git/HEAD|git/objects|git/refs) {
            root $git_root;
        }
    }

    # =============================================
    # API 请求（反向代理到 FastAPI）
    # =============================================
    location /api/ {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =============================================
    # WebSocket 端点
    # =============================================
    location /ws {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # =============================================
    # 健康检查
    # =============================================
    location /health {
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
    }
}
