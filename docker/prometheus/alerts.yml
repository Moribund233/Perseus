# Perseus 告警规则
# 目标：错误率（5xx 占比）超过 1% 持续 5 分钟触发告警（F-057）
groups:
  - name: perseus
    rules:
      - record: job:perseus:error_ratio:rate5m
        expr: |
          sum(rate(perseus_http_requests_total{status="5xx"}[5m]))
            / (sum(rate(perseus_http_requests_total[5m])) + 1e-9)
        labels:
          service: perseus-app

      - alert: PerseusErrorRateHigh
        expr: job:perseus:error_ratio:rate5m > 0.01
        for: 5m
        labels:
          severity: critical
          service: perseus-app
        annotations:
          summary: "Perseus 请求错误率超过 1%"
          description: "最近 5 分钟 5xx 占比为 {{ printf \"%.2f\" $value }}%，超过 1% 阈值，请检查后端日志与依赖服务。"

      - alert: PerseusRequestLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(perseus_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: perseus-app
        annotations:
          summary: "Perseus P95 延迟超过 2s"
          description: "最近 10 分钟 P95 请求延迟为 {{ printf \"%.2f\" $value }}s，超过 2s 阈值。"