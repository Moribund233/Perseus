# =============================================================================
# Perseus 开发环境 Nginx 配置
#
# 架构说明：
#   1. Git HTTP Smart Protocol → git-cgi 容器 (fcgiwrap + git-http-backend)
#   2. API/WebSocket 请求 → FastAPI 后端
#   3. 前端 → 本地 Vite 开发服务器 (localhost:5173)
#
# 容器间通信：
#   Nginx (fastcgi) → git-cgi:9000 (fcgiwrap TCP)
#   Nginx (proxy)   → app:8000     (FastAPI)
#
# 开发环境特性：
#   - 前端请求代理到本地 Vite 服务器
#   - 放宽速率限制便于调试
#   - 开启详细错误日志
#   - CORS 由 Nginx 统一处理
# =============================================================================

upstream fastapi_backend {
    server app:8000;
}

upstream git_cgi_backend {
    server git-cgi:9000;
}

upstream vite_frontend {
    server host.docker.internal:5173;
}

# =============================================
# CORS 配置映射 (开发环境允许所有本地源)
# =============================================
map $http_origin $cors_origin {
    default "";
    # 允许所有本地开发源
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    "~^http://192\.168\.[0-9]+\.[0-9]+(:[0-9]+)?$" $http_origin;
    "~^http://10\.[0-9]+\.[0-9]+\.[0-9]+(:[0-9]+)?$" $http_origin;
    "~^http://172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+(:[0-9]+)?$" $http_origin;
}

# =============================================
# 开发环境速率限制（放宽限制便于调试）
# =============================================

# 通用 API 请求限速（开发环境放宽）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;

# 登录认证限速（开发环境放宽）
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;

# Git 克隆/拉取限速（开发环境放宽）
limit_req_zone $binary_remote_addr zone=git_clone_limit:10m rate=120r/m;

# Git 推送限速（开发环境放宽）
limit_req_zone $binary_remote_addr zone=git_push_limit:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # 请求体大小限制（允许大文件推送）
    client_max_body_size 500M;

    # 开发环境详细日志
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    # =============================================
    # CORS 预检请求处理 (OPTIONS)
    # =============================================
    location / {
        # 处理 CORS 预检请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' '600' always;
            add_header 'Content-Length' 0;
            return 204;
        }

        # 其他请求代理到 Vite 开发服务器
        proxy_pass http://vite_frontend;
        proxy_http_version 1.1;

        # CORS 头
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # WebSocket 支持（Vite HMR 需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 开发环境长连接超时设置
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # =============================================
    # API 请求 → FastAPI
    # =============================================
    location /api/ {
        # CORS 头
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 开发环境放宽限速
        limit_req zone=api_limit burst=50 nodelay;
    }

    # =============================================
    # WebSocket → FastAPI
    # =============================================
    location /ws/ {
        # CORS 头
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # =============================================
    # 静态文件 → FastAPI (docs, redoc, openapi.json)
    # =============================================
    location ~ ^/(docs|redoc|openapi\.json) {
        # CORS 头
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =============================================
    # Git HTTP Smart Protocol
    # =============================================
    # 匹配 /username/repo.git/... 格式的 Git 请求
    location ~ ^/(?<username>[^/]+)/(?<reponame>[^/]+)\.git/ {
        # 禁用 gzip（Git 协议自己处理压缩）
        gzip off;

        # CORS 头
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # ---- Smart Protocol: clone/fetch ----
        location ~ \.git/(info/refs|git-upload-pack)$ {
            include fastcgi_params;

            fastcgi_pass git_cgi_backend;

            # CGI 程序路径
            fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;

            # Git 环境变量
            fastcgi_param GIT_PROJECT_ROOT $git_root;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param REMOTE_USER $remote_user;

            # 超时配置（大仓库需要更长超时）
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;

            # 开发环境放宽限速
            limit_req zone=git_clone_limit burst=20 nodelay;
        }

        # ---- Smart Protocol: push ----
        location ~ \.git/git-receive-pack$ {
            include fastcgi_params;

            fastcgi_pass git_cgi_backend;

            fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;

            fastcgi_param GIT_PROJECT_ROOT $git_root;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param REMOTE_USER $remote_user;

            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;

            # 开发环境放宽限速
            limit_req zone=git_push_limit burst=10 nodelay;
        }

        # ---- 其他 Git 相关请求 ----
        location ~ \.git/ {
            include fastcgi_params;

            fastcgi_pass git_cgi_backend;

            fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;

            fastcgi_param GIT_PROJECT_ROOT $git_root;
            fastcgi_param PATH_INFO $uri;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            fastcgi_param REMOTE_USER $remote_user;
        }
    }

    # =============================================
    # 认证相关 API (登录/注册) → 更严格的限速
    # =============================================
    location ~ ^/api/(auth|login|register|token) {
        # CORS 头
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 认证接口限速（防止暴力破解）
        limit_req zone=auth_limit burst=5 nodelay;
    }
}
