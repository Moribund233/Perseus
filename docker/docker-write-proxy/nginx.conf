# 窄写 Docker 代理 — 仅放行对容器的启停操作（admin 控制台开关可选服务栈）
#
# 部署为 docker-write-proxy 服务，与只读 docker-socket-proxy 并存：
#   - 读（GET /containers*）继续走 docker-socket-proxy（只读，POST=0）
#   - 写（start/stop/restart）仅经本代理，且只允许 POST 到指定路径
#
# 与 docker-socket-proxy 的关系：它负责把「Docker 控制面」整体挡在应用容器
# 之外；本代理是被允许的最小写窗口 — 即使应用被攻破，也只能启停容器，
# 无法 create/exec/pull 等，宿主机控制面仍在代理层被拦截。
#
# 挂载：
#   ./nginx.conf               -> /usr/local/openresty/nginx/conf/nginx.conf:ro
#   ./docker_write_acl.lua     -> /etc/nginx/docker_write_acl.lua:ro
#   /var/run/docker.sock       -> /var/run/docker.sock:ro
worker_processes 1;

# 本容器唯一职责就是桥接 Docker unix socket；proxy_pass/ACL 都要读 daemon
# socket（默认 root:docker 0600），worker 必须以能访问它的身份运行。
user root;

events {
    worker_connections 1024;
}

http {
    # Docker Engine API 走 unix socket；nginx 以 HTTP 形式转发方法/路径/请求体。
    upstream docker_unix {
        server unix:/var/run/docker.sock fail_timeout=0;
    }

    server {
        listen 2376;
        server_name _;

        location / {
            access_by_lua_file /etc/nginx/docker_write_acl.lua;
            proxy_pass http://docker_unix;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}