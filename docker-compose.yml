# =============================================================================
# Perseus 业务层编排（基础设施见 docker-compose.base.yml，通过 include 合并）
#
# 部署 & 运维（推荐）:
#   bash scripts/install.sh                 # 一键安装（含初始化）
#   bash scripts/mgt.sh start|stop|status   # 生命周期
#   bash scripts/mgt.sh upgrade             # 升级（自动备份+迁移）
#   bash scripts/mgt.sh backup / restore    # 备份 / 恢复
#   bash scripts/mgt.sh reset-admin         # 重设管理员密码
#
# 手工流程（与 install.sh 等价）:
#   docker compose up -d postgres redis
#   docker compose --profile init run --rm init
#   docker compose up -d
#
# 镜像版本控制:
#   PERSEUS_IMAGE_TAG    镜像标签（默认 latest；固定版本如 v0.1.0）
#   PERSEUS_IMAGE_PREFIX 镜像前缀（默认 perseus；推送私有仓库时设置为
#                        registry.example.com/perseus，并配合 docker compose pull）
# =============================================================================

include:
  - docker-compose.base.yml

services:
  # FastAPI 后端
  app:
    image: ${PERSEUS_IMAGE_PREFIX:-perseus}-app:${PERSEUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perseus-app
    environment:
      DATABASE_URL: postgresql://perseus:${POSTGRES_PASSWORD:?必需设置数据库密码}@postgres:5432/perseus
      REDIS_URL: redis://redis:6379/0
      PERSEUS_SECURITY_SECRET_KEY: ${PERSEUS_SECURITY_SECRET_KEY:?必需设置 JWT 密钥}
      PERSEUS_APP_DEBUG: "${PERSEUS_APP_DEBUG:-false}"
      PERSEUS_STRESS_TEST: "false"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # 生产多容器：schema 迁移由 init 服务完成，app 启动仅做只读就绪校验
      PERSEUS_INIT_DATABASE: "false"
      PERSEUS_STORAGE_REPO_ROOT: /data/repositories
      TZ: Asia/Shanghai
      PERSEUS_ADMIN_USERNAME: ${PERSEUS_ADMIN_USERNAME:-admin}
      PERSEUS_ADMIN_PASSWORD: ${PERSEUS_ADMIN_PASSWORD:?必需设置管理员初始密码}
      PERSEUS_ADMIN_EMAIL: ${PERSEUS_ADMIN_EMAIL:-admin@perseus.local}
      PERSEUS_COLLAB_INTERNAL_SECRET: ${PERSEUS_COLLAB_INTERNAL_SECRET:?必需设置协作网关内部密钥 (scripts/generate_env.py)}
      # 编排组件状态：经只读 docker-socket-proxy 查询容器状态（admin 控制台）
      PERSEUS_DOCKER_HOST: "http://docker-socket-proxy:2375"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - repos:/data/repositories
      - lfs:/data/lfs
      - app-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  # 协作编辑 Yjs 网关 (Hocuspocus 哑管道: CRDT 同步 + app 回调)
  # 多副本就绪: 移除 container_name 以允许 --scale collab=N;
  # 同一文档落在不同副本时经 Redis pub/sub 收敛 (m4)。默认仍单副本,
  # nginx 动态解析与负载均衡留待真正扩容时处理 (见 docs/collab-f204-vs-cwm.md 5.6)。
  collab:
    image: ${PERSEUS_IMAGE_PREFIX:-perseus}-collab:${PERSEUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/collab/Dockerfile
    environment:
      PERSEUS_APP_URL: http://app:8000
      PERSEUS_COLLAB_INTERNAL_SECRET: ${PERSEUS_COLLAB_INTERNAL_SECRET:?必需设置协作网关内部密钥 (scripts/generate_env.py)}
      # 配置后启用: 跨副本即时同步 (pub/sub) + 会话快照持久化
      REDIS_URL: redis://redis:6379/0
      PERSEUS_COLLAB_SESSION_TTL_MS: "${PERSEUS_COLLAB_TTL_MS:-600000}"
      PERSEUS_COLLAB_MAX_CONTENT_CHARS: "${PERSEUS_COLLAB_MAX_CONTENT_CHARS:-2000000}"
      PERSEUS_COLLAB_MAX_CONNECTIONS_PER_DOC: "${PERSEUS_COLLAB_MAX_CONNECTIONS_PER_DOC:-50}"
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  # git-http-backend CGI
  git-cgi:
    image: ${PERSEUS_IMAGE_PREFIX:-perseus}-git-cgi:${PERSEUS_IMAGE_TAG:-latest}
    build:
      context: ./docker/git-cgi
    container_name: perseus-git-cgi
    volumes:
      - repos:/data/repositories
    environment:
      FCGI_PORT: "9000"
      GIT_PROJECT_ROOT: /data/repositories
      GIT_HTTP_EXPORT_ALL: "1"
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # OpenResty 网关
  gateway:
    image: openresty/openresty:1.31.1.1-0-bookworm-fat
    container_name: perseus-gateway
    ports:
      - "${PERSEUS_GATEWAY_PORT:-8000}:8000"
    volumes:
      - ./docker/gateway/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - /var/www/perseus-web:/var/www/perseus-web:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
      git-cgi:
        condition: service_started
      collab:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  # SSH 服务器 — Git over SSH
  sshd:
    image: ${PERSEUS_IMAGE_PREFIX:-perseus}-sshd:${PERSEUS_IMAGE_TAG:-latest}
    build:
      context: ./docker/ssh
    container_name: perseus-sshd
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      - repos:/data/repositories
    environment:
      PERSEUS_DB_URL: "host=postgres dbname=perseus user=perseus password=${POSTGRES_PASSWORD:?必需设置数据库密码}"
    networks:
      - default
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  # 只读 Docker socket 代理 — 供 app 查询编排组件状态（admin 控制台）
  # 仅暴露 /containers* 的 GET，禁止一切写操作（POST=0），
  # 避免把 Docker 控制面直接交给应用容器。
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: perseus-docker-proxy
    environment:
      CONTAINERS: "1"   # 允许 GET /containers/*
      POST: "0"         # 禁止写操作
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 16M

  # 一次性数据库初始化任务（Alembic 迁移 + 管理员引导）
  # 运行: docker compose --profile init run --rm init
  init:
    image: ${PERSEUS_IMAGE_PREFIX:-perseus}-app:${PERSEUS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perseus-init
    command: ["python", "scripts/init_db.py"]
    profiles: ["init"]
    environment:
      DATABASE_URL: postgresql://perseus:${POSTGRES_PASSWORD:?必需设置数据库密码}@postgres:5432/perseus
      PERSEUS_SECURITY_SECRET_KEY: ${PERSEUS_SECURITY_SECRET_KEY:?必需设置 JWT 密钥}
      PERSEUS_APP_DEBUG: "${PERSEUS_APP_DEBUG:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      TZ: Asia/Shanghai
      PERSEUS_ADMIN_USERNAME: ${PERSEUS_ADMIN_USERNAME:-admin}
      PERSEUS_ADMIN_PASSWORD: ${PERSEUS_ADMIN_PASSWORD:?必需设置管理员初始密码}
      PERSEUS_ADMIN_EMAIL: ${PERSEUS_ADMIN_EMAIL:-admin@perseus.local}
    volumes:
      - ./config.toml:/app/config.toml:ro
      - app-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  # 测试容器（专用 profile: docker compose --profile test run --rm test [pytest 参数]）
  test:
    build:
      context: .
      dockerfile: docker/test/Dockerfile.test
    profiles: ["test"]
    environment:
      DATABASE_URL: sqlite:///./test_perseus.db
      PERSEUS_SECURITY_SECRET_KEY: test-secret-key-not-for-production
      PERSEUS_STRESS_TEST: "false"
      LOG_LEVEL: warning
      TZ: Asia/Shanghai
    volumes:
      # 挂载源码, 测试始终运行最新代码, 无需重建镜像
      - ./config.toml:/app/config.toml:ro
      - ./tests:/app/tests
      - ./services:/app/services
      - ./api:/app/api
      - ./core:/app/core
      - ./models:/app/models
      - ./utils:/app/utils
      - ./middleware:/app/middleware
      - ./controller:/app/controller
      - ./alembic:/app/alembic
      - ./app.py:/app/app.py
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

volumes:
  repos:
    driver: local
  lfs:
    driver: local
  app-logs:
    driver: local