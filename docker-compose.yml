# =============================================================================
# Perseus Docker Compose
#
# 架构：
#   nginx → git-http-backend (CGI) — Git HTTP Smart Protocol
#   nginx → FastAPI (proxy)       — API / WebSocket
#   FastAPI → PostgreSQL           — 数据库
#
# 使用方式:
#   docker compose up -d                     # 启动全部服务
#   docker compose up -d app db              # 不带 Nginx
#   docker compose -f docker-compose.yml up  # 指定文件
#
# 环境变量要求:
#   DATABASE_URL=postgresql://perseus:password@db:5432/perseus
#   PERSEUS_SECURITY_SECRET_KEY=<random-secret>
# =============================================================================

services:
  # =============================================
  # PostgreSQL 数据库
  # =============================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: perseus
      POSTGRES_USER: perseus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-perseus_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perseus"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================
  # FastAPI 后端
  # =============================================
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://perseus:perseus_secret@db:5432/perseus}
      PERSEUS_SECURITY_SECRET_KEY: ${PERSEUS_SECURITY_SECRET_KEY:?必需设置 JWT 密钥}
      PERSEUS_APP_DEBUG: "${PERSEUS_APP_DEBUG:-false}"
      PERSEUS_STRESS_TEST: "false"
    volumes:
      - repos:/data/repositories
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # =============================================
  # git-http-backend CGI 容器
  # =============================================
  git-cgi:
    build:
      context: ./docker/git-cgi
    volumes:
      - repos:/data/repositories
    environment:
      FCGI_PORT: "9000"
      GIT_PROJECT_ROOT: /data/repositories
      GIT_HTTP_EXPORT_ALL: "1"
    restart: unless-stopped

  # =============================================
  # Nginx (反向代理 + Git HTTP 协议路由)
  # =============================================
  nginx:
    image: nginx:alpine
    depends_on:
      - app
      - git-cgi
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - repos:/data/repositories:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  pgdata:
  repos:
