# =============================================================================
# LanGit Docker Compose
#
# 架构：
#   nginx → git-http-backend (CGI) — Git HTTP Smart Protocol
#   nginx → FastAPI (proxy)       — API / WebSocket
#   FastAPI → PostgreSQL           — 数据库
#
# 使用方式:
#   docker compose up -d                     # 启动全部服务
#   docker compose up -d app db              # 不带 Nginx
#   docker compose -f docker-compose.yml up  # 指定文件
#
# 环境变量要求:
#   DATABASE_URL=postgresql://langit:password@db:5432/langit
#   LANGIT_SECURITY_SECRET_KEY=<random-secret>
# =============================================================================

services:
  # =============================================
  # PostgreSQL 数据库
  # =============================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: langit
      POSTGRES_USER: langit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-langit_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langit"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================
  # FastAPI 后端
  # =============================================
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://langit:langit_secret@db:5432/langit}
      LANGIT_SECURITY_SECRET_KEY: ${LANGIT_SECURITY_SECRET_KEY:?必需设置 JWT 密钥}
      LANGIT_APP_DEBUG: "${LANGIT_APP_DEBUG:-false}"
      LANGIT_STRESS_TEST: "false"
    volumes:
      - repos:/data/repositories
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # =============================================
  # Nginx + git-http-backend
  # =============================================
  nginx:
    image: nginx:alpine
    depends_on:
      - app
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - repos:/data/repositories:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  pgdata:
  repos:
