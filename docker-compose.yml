services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: perseus-postgres
    environment:
      POSTGRES_USER: perseus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必需设置数据库密码}
      POSTGRES_DB: perseus
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perseus -d perseus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Redis（可选缓存，为空则应用不使用）
  redis:
    image: redis:7-alpine
    container_name: perseus-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 320M

  # FastAPI 后端
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perseus-app
    environment:
      DATABASE_URL: postgresql://perseus:${POSTGRES_PASSWORD:?必需设置数据库密码}@postgres:5432/perseus
      REDIS_URL: redis://redis:6379/0
      PERSEUS_SECURITY_SECRET_KEY: ${PERSEUS_SECURITY_SECRET_KEY:?必需设置 JWT 密钥}
      PERSEUS_APP_DEBUG: "${PERSEUS_APP_DEBUG:-false}"
      PERSEUS_STRESS_TEST: "false"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # 生产多容器：schema 迁移由 init 服务完成，app 启动仅做只读就绪校验
      PERSEUS_INIT_DATABASE: "false"
      PERSEUS_STORAGE_REPO_ROOT: /data/repositories
      TZ: Asia/Shanghai
      PERSEUS_ADMIN_USERNAME: admin
      PERSEUS_ADMIN_PASSWORD: ${PERSEUS_ADMIN_PASSWORD:-perseus_admin_2024}
      PERSEUS_ADMIN_EMAIL: admin@perseus.local
      PERSEUS_COLLAB_INTERNAL_SECRET: ${PERSEUS_COLLAB_INTERNAL_SECRET:?必需设置协作网关内部密钥 (scripts/generate_env.py)}
    volumes:
      - ./config.toml:/app/config.toml:ro
      - repos:/data/repositories
      - app-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  # 协作编辑 Yjs 网关 (Hocuspocus 哑管道: CRDT 同步 + app 回调)
  collab:
    build:
      context: .
      dockerfile: docker/collab/Dockerfile
    container_name: perseus-collab
    environment:
      PERSEUS_APP_URL: http://app:8000
      PERSEUS_COLLAB_INTERNAL_SECRET: ${PERSEUS_COLLAB_INTERNAL_SECRET:?必需设置协作网关内部密钥 (scripts/generate_env.py)}
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  # git-http-backend CGI
  git-cgi:
    build:
      context: ./docker/git-cgi
    container_name: perseus-git-cgi
    volumes:
      - repos:/data/repositories
    environment:
      FCGI_PORT: "9000"
      GIT_PROJECT_ROOT: /data/repositories
      GIT_HTTP_EXPORT_ALL: "1"
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # OpenResty 网关
  gateway:
    image: openresty/openresty:1.31.1.1-0-bookworm-fat
    container_name: perseus-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./docker/gateway/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - /var/www/perseus-web:/var/www/perseus-web:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      git-cgi:
        condition: service_started
      collab:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  # SSH 服务器 — Git over SSH
  sshd:
    build:
      context: ./docker/ssh
    container_name: perseus-sshd
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      - repos:/data/repositories
    environment:
      PERSEUS_DB_URL: "host=postgres dbname=perseus user=perseus password=${POSTGRES_PASSWORD:?必需设置数据库密码}"
    networks:
      - default
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M

  # 一次性数据库初始化任务（Alembic 迁移 + 管理员引导）
  # 运行: docker compose --profile init run --rm init
  init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perseus-init
    command: ["python", "scripts/init_db.py"]
    profiles: ["init"]
    environment:
      DATABASE_URL: postgresql://perseus:${POSTGRES_PASSWORD:?必需设置数据库密码}@postgres:5432/perseus
      PERSEUS_SECURITY_SECRET_KEY: ${PERSEUS_SECURITY_SECRET_KEY:?必需设置 JWT 密钥}
      PERSEUS_APP_DEBUG: "${PERSEUS_APP_DEBUG:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      TZ: Asia/Shanghai
      PERSEUS_ADMIN_USERNAME: admin
      PERSEUS_ADMIN_PASSWORD: ${PERSEUS_ADMIN_PASSWORD:-perseus_admin_2024}
      PERSEUS_ADMIN_EMAIL: admin@perseus.local
    volumes:
      - ./config.toml:/app/config.toml:ro
      - app-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  # 测试容器（专用 profile: docker compose --profile test run --rm test [pytest 参数]）
  test:
    build:
      context: .
      dockerfile: docker/test/Dockerfile.test
    profiles: ["test"]
    environment:
      DATABASE_URL: sqlite:///./test_perseus.db
      PERSEUS_SECURITY_SECRET_KEY: test-secret-key-not-for-production
      PERSEUS_STRESS_TEST: "false"
      LOG_LEVEL: warning
      TZ: Asia/Shanghai
    volumes:
      # 挂载源码, 测试始终运行最新代码, 无需重建镜像
      - ./config.toml:/app/config.toml:ro
      - ./tests:/app/tests
      - ./services:/app/services
      - ./api:/app/api
      - ./core:/app/core
      - ./models:/app/models
      - ./utils:/app/utils
      - ./middleware:/app/middleware
      - ./controller:/app/controller
      - ./app.py:/app/app.py
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

volumes:
  repos:
    driver: local
  app-logs:
    driver: local
  postgres-data:
    driver: local

networks:
  default:
    name: perseus-network
    driver: bridge
