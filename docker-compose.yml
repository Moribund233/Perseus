services:
  # FastAPI 后端
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perseus-app
    environment:
      DATABASE_URL: postgresql://perseus:Perseus_2024!@capella-pg:5432/perseus
      REDIS_URL: redis://capella-redis:6379/0
      PERSEUS_SECURITY_SECRET_KEY: ${PERSEUS_SECURITY_SECRET_KEY:?必需设置 JWT 密钥}
      PERSEUS_APP_DEBUG: "${PERSEUS_APP_DEBUG:-false}"
      PERSEUS_STRESS_TEST: "false"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PERSEUS_STORAGE_REPO_ROOT: /data/repositories
      TZ: Asia/Shanghai
      PERSEUS_ADMIN_USERNAME: admin
      PERSEUS_ADMIN_PASSWORD: perseus_admin_2024
      PERSEUS_ADMIN_EMAIL: admin@perseus.local
    volumes:
      - repos:/data/repositories
      - app-logs:/app/logs
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - capella-room_default
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # git-http-backend CGI
  git-cgi:
    build:
      context: ./docker/git-cgi
    container_name: perseus-git-cgi
    volumes:
      - repos:/data/repositories
    environment:
      FCGI_PORT: "9000"
      GIT_PROJECT_ROOT: /data/repositories
      GIT_HTTP_EXPORT_ALL: "1"
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # OpenResty 网关 — CORS + 反向代理
  gateway:
    image: openresty/openresty:1.31.1.1-0-bookworm-fat
    container_name: perseus-gateway
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./docker/gateway/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  repos:
    driver: local
  app-logs:
    driver: local

networks:
  default:
    name: perseus-network
    driver: bridge
  capella-room_default:
    external: true
