# =============================================================================
# Perseus 基础设施层：PostgreSQL + Redis + 数据卷 + 网络
#
# 由业务层 docker-compose.yml 通过 include 引入；也可以按层单独操作：
#   docker compose -f docker-compose.base.yml up -d postgres redis
#
# 卷与网络在此定义，升级业务层（docker-compose.yml）时不会触碰基础设施。
# =============================================================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: perseus-postgres
    environment:
      POSTGRES_USER: perseus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必需设置数据库密码}
      POSTGRES_DB: perseus
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perseus -d perseus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Redis（可选缓存，为空则应用不使用）
  redis:
    image: redis:7-alpine
    container_name: perseus-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 320M

volumes:
  postgres-data:
    driver: local

networks:
  default:
    name: ${PERSEUS_NETWORK_NAME:-perseus-network}
    driver: bridge