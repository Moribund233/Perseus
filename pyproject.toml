[tool.poetry]
name = "langit"
version = "0.1.0"
description = "A Git-based collaborative development tool"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{ include = "langit" }]
package-mode = false

[[tool.poetry.source]]
name = "ali"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"


[[tool.poetry.source]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
priority = "supplemental"


[[tool.poetry.source]]
name = "tsinghua"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "supplemental"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.115.4"
pygit2 = "^1.19.1"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
gunicorn = { version = "^23.0.0", markers = "sys_platform != 'win32'" }
pydantic-settings = "^2.6.0"
pydantic = { extras = ["email"], version = "^2.9.2" }
toml = "^0.10.2"
httpx = "^0.27.2"
sqlalchemy = "^2.0.34"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "4.0.0"
slowapi = "^0.1.9"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
psutil = "^7.0.0"

# Database drivers (all required for full database support)
psycopg2-binary = "^2.9.9"  # PostgreSQL driver (C extension)
pg8000 = "^1.31.0"  # PostgreSQL driver (pure Python)
pymysql = "^1.1.0"  # MySQL driver
aiosqlite = "^0.20.0"  # Async SQLite driver
asyncpg = "^0.30.0"  # Async PostgreSQL driver
aiomysql = "^0.2.0"  # Async MySQL driver
greenlet = "^3.1.0"  # Required for SQLAlchemy async operations
cryptography = "^42.0.0"  # Required for MySQL SSL

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
black = "^24.10.0"
isort = "^5.13.2"
flake8 = "^7.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
