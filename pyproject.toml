[project]
name = "perseus"
version = "0.1.0"
description = "A Git-based collaborative development tool"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.4",
    "pygit2>=1.19.1",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0; sys_platform != 'win32'",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.9.2",
    "toml>=0.10.2",
    "httpx>=0.27.2",
    "sqlalchemy>=2.0.34",
    "alembic>=1.13.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "psutil>=7.0.0",
    "psycopg2>=2.9.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "aiofiles>=24.1.0",
    "aiosmtplib>=3.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "isort>=5.13.2",
    "flake8>=7.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
norecursedirs = ["sqlite+aio.*", ".*", "dist", "build", "node_modules"]
