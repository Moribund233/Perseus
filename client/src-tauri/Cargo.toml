[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }

# WebSocket 客户端
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures = "0.3"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 进程管理
sysinfo = "0.30"

# 配置管理
dirs = "5.0"
once_cell = "1.19"
toml = "0.8"

# 本地认证
rand = "0.8"
base64 = "0.22"

# 加密
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"

# ZIP解压
zip = "2.2"

# 编码处理
encoding_rs = "0.8"

# Linux 相关依赖
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dependencies.tauri-plugin-http]
features = ["unsafe-headers"]
version = "2.0.0"

[dependencies.tauri-plugin-dialog]
version = "2"

# ==================== 编译优化配置 ====================
[profile.dev]
# 开发模式优化 - 平衡编译速度和运行时性能
opt-level = 1           # 基本优化
lto = false             # 禁用链接时优化（加快编译）
codegen-units = 16      # 并行代码生成单元
panic = "unwind"        # 使用 unwind 而非 abort

[profile.release]
# 发布模式优化
opt-level = 3           # 最高优化级别
lto = true              # 启用链接时优化
codegen-units = 1       # 单代码生成单元（更好的优化）
panic = "abort"         # 使用 abort 减小体积
strip = true            # 剥离符号表
