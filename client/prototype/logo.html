<!DOCTYPE svg>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#58a6ff"/>
<stop offset="100%" stop-color="#bc8cff"/>
</linearGradient>
<linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#1f6feb"/>
<stop offset="50%" stop-color="#58a6ff"/>
<stop offset="100%" stop-color="#bc8cff"/>
</linearGradient>
<radialGradient id="glow">
<stop offset="0%" stop-color="#58a6ff" stop-opacity="0.3"/>
<stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
</radialGradient>
<filter id="blur">
<feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
</filter>
</defs>

<rect width="800" height="600" fill="#0d1117"/>

<!-- 标题 -->
<text x="400" y="40" fill="#e6edf3" font-size="20" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Perseus Logo Variations</text>

<!-- Logo 1: 星座连线风格 -->
<g transform="translate(150, 150)">
<circle cx="0" cy="0" r="80" fill="url(#glow)" opacity="0.5"/>
<!-- 星座点 -->
<circle cx="-30" cy="-40" r="3" fill="#58a6ff"/>
<circle cx="20" cy="-35" r="2.5" fill="#58a6ff"/>
<circle cx="35" cy="-10" r="3.5" fill="#bc8cff"/>
<circle cx="15" cy="25" r="3" fill="#58a6ff"/>
<circle cx="-25" cy="30" r="2.5" fill="#58a6ff"/>
<circle cx="-40" cy="5" r="3" fill="#bc8cff"/>
<circle cx="0" cy="0" r="4" fill="url(#blueGrad1)"/>
<!-- 连线 -->
<line x1="-30" y1="-40" x2="20" y2="-35" stroke="#58a6ff" stroke-width="1" opacity="0.6"/>
<line x1="20" y1="-35" x2="35" y2="-10" stroke="#58a6ff" stroke-width="1" opacity="0.6"/>
<line x1="35" y1="-10" x2="15" y2="25" stroke="#bc8cff" stroke-width="1" opacity="0.6"/>
<line x1="15" y1="25" x2="-25" y2="30" stroke="#58a6ff" stroke-width="1" opacity="0.6"/>
<line x1="-25" y1="30" x2="-40" y2="5" stroke="#58a6ff" stroke-width="1" opacity="0.6"/>
<line x1="-40" y1="5" x2="-30" y2="-40" stroke="#bc8cff" stroke-width="1" opacity="0.6"/>
<line x1="0" y1="0" x2="-30" y2="-40" stroke="#58a6ff" stroke-width="0.5" opacity="0.3"/>
<line x1="0" y1="0" x2="35" y2="-10" stroke="#bc8cff" stroke-width="0.5" opacity="0.3"/>
<line x1="0" y1="0" x2="-25" y2="30" stroke="#58a6ff" stroke-width="0.5" opacity="0.3"/>
<!-- 文字 -->
<text x="0" y="100" fill="#e6edf3" font-size="24" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">PERSEUS</text>
<text x="0" y="120" fill="#8b949e" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" letter-spacing="2">CONSTELLATION</text>
</g>

<!-- Logo 2: 星系旋涡风格 -->
<g transform="translate(400, 150)">
<circle cx="0" cy="0" r="80" fill="url(#glow)" opacity="0.5"/>
<!-- 旋涡点 -->
<circle cx="0" cy="0" r="4" fill="url(#blueGrad1)"/>
<circle cx="20" cy="-15" r="2.5" fill="#58a6ff"/>
<circle cx="35" cy="-5" r="2" fill="#58a6ff"/>
<circle cx="40" cy="15" r="2.5" fill="#bc8cff"/>
<circle cx="30" cy="30" r="2" fill="#58a6ff"/>
<circle cx="10" cy="38" r="2.5" fill="#58a6ff"/>
<circle cx="-15" cy="35" r="2" fill="#bc8cff"/>
<circle cx="-32" cy="22" r="2.5" fill="#58a6ff"/>
<circle cx="-38" cy="0" r="2" fill="#58a6ff"/>
<circle cx="-30" cy="-22" r="2.5" fill="#bc8cff"/>
<circle cx="-12" cy="-35" r="2" fill="#58a6ff"/>
<!-- 旋涡曲线 -->
<path d="M 0,0 Q 20,-15 35,-5" stroke="#58a6ff" stroke-width="1" fill="none" opacity="0.6"/>
<path d="M 35,-5 Q 40,15 30,30" stroke="#bc8cff" stroke-width="1" fill="none" opacity="0.6"/>
<path d="M 30,30 Q 10,38 -15,35" stroke="#58a6ff" stroke-width="1" fill="none" opacity="0.6"/>
<path d="M -15,35 Q -32,22 -38,0" stroke="#bc8cff" stroke-width="1" fill="none" opacity="0.6"/>
<path d="M -38,0 Q -30,-22 -12,-35" stroke="#58a6ff" stroke-width="1" fill="none" opacity="0.6"/>
<path d="M -12,-35 Q 5,-38 20,-15" stroke="#58a6ff" stroke-width="1" fill="none" opacity="0.6"/>
<!-- 外围小点 -->
<circle cx="50" cy="-25" r="1.5" fill="#58a6ff" opacity="0.4"/>
<circle cx="55" cy="25" r="1.5" fill="#bc8cff" opacity="0.4"/>
<circle cx="-20" cy="50" r="1.5" fill="#58a6ff" opacity="0.4"/>
<circle cx="-50" cy="-10" r="1.5" fill="#58a6ff" opacity="0.4"/>
<!-- 文字 -->
<text x="0" y="100" fill="#e6edf3" font-size="24" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">PERSEUS</text>
<text x="0" y="120" fill="#8b949e" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" letter-spacing="2">GALAXY</text>
</g>

<!-- Logo 3: 网络节点风格 -->
<g transform="translate(650, 150)">
<circle cx="0" cy="0" r="80" fill="url(#glow)" opacity="0.5"/>
<!-- 中心节点 -->
<circle cx="0" cy="0" r="5" fill="url(#blueGrad1)"/>
<!-- 内圈节点 -->
<circle cx="0" cy="-30" r="3" fill="#58a6ff"/>
<circle cx="26" cy="-15" r="3" fill="#58a6ff"/>
<circle cx="26" cy="15" r="3" fill="#bc8cff"/>
<circle cx="0" cy="30" r="3" fill="#58a6ff"/>
<circle cx="-26" cy="15" r="3" fill="#58a6ff"/>
<circle cx="-26" cy="-15" r="3" fill="#bc8cff"/>
<!-- 外圈节点 -->
<circle cx="0" cy="-55" r="2" fill="#58a6ff" opacity="0.6"/>
<circle cx="48" cy="-27" r="2" fill="#58a6ff" opacity="0.6"/>
<circle cx="48" cy="27" r="2" fill="#bc8cff" opacity="0.6"/>
<circle cx="0" cy="55" r="2" fill="#58a6ff" opacity="0.6"/>
<circle cx="-48" cy="27" r="2" fill="#58a6ff" opacity="0.6"/>
<circle cx="-48" cy="-27" r="2" fill="#58a6ff" opacity="0.6"/>
<!-- 连接线 - 中心到内圈 -->
<line x1="0" y1="0" x2="0" y2="-30" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
<line x1="0" y1="0" x2="26" y2="-15" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
<line x1="0" y1="0" x2="26" y2="15" stroke="#bc8cff" stroke-width="1" opacity="0.5"/>
<line x1="0" y1="0" x2="0" y2="30" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
<line x1="0" y1="0" x2="-26" y2="15" stroke="#58a6ff" stroke-width="1" opacity="0.5"/>
<line x1="0" y1="0" x2="-26" y2="-15" stroke="#bc8cff" stroke-width="1" opacity="0.5"/>
<!-- 连接线 - 内圈互联 -->
<line x1="0" y1="-30" x2="26" y2="-15" stroke="#58a6ff" stroke-width="0.8" opacity="0.3"/>
<line x1="26" y1="-15" x2="26" y2="15" stroke="#58a6ff" stroke-width="0.8" opacity="0.3"/>
<line x1="26" y1="15" x2="0" y2="30" stroke="#bc8cff" stroke-width="0.8" opacity="0.3"/>
<line x1="0" y1="30" x2="-26" y2="15" stroke="#58a6ff" stroke-width="0.8" opacity="0.3"/>
<line x1="-26" y1="15" x2="-26" y2="-15" stroke="#58a6ff" stroke-width="0.8" opacity="0.3"/>
<line x1="-26" y1="-15" x2="0" y2="-30" stroke="#bc8cff" stroke-width="0.8" opacity="0.3"/>
<!-- 连接线 - 内圈到外圈 -->
<line x1="0" y1="-30" x2="0" y2="-55" stroke="#58a6ff" stroke-width="0.5" opacity="0.2"/>
<line x1="26" y1="-15" x2="48" y2="-27" stroke="#58a6ff" stroke-width="0.5" opacity="0.2"/>
<line x1="26" y1="15" x2="48" y2="27" stroke="#bc8cff" stroke-width="0.5" opacity="0.2"/>
<line x1="0" y1="30" x2="0" y2="55" stroke="#58a6ff" stroke-width="0.5" opacity="0.2"/>
<line x1="-26" y1="15" x2="-48" y2="27" stroke="#58a6ff" stroke-width="0.5" opacity="0.2"/>
<line x1="-26" y1="-15" x2="-48" y2="-27" stroke="#58a6ff" stroke-width="0.5" opacity="0.2"/>
<!-- 文字 -->
<text x="0" y="100" fill="#e6edf3" font-size="24" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">PERSEUS</text>
<text x="0" y="120" fill="#8b949e" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" letter-spacing="2">NETWORK</text>
</g>

<!-- Logo 4: 极简几何风格 -->
<g transform="translate(150, 400)">
<circle cx="0" cy="0" r="80" fill="url(#glow)" opacity="0.5"/>
<!-- 三角形点 -->
<circle cx="0" cy="-45" r="4" fill="url(#blueGrad1)"/>
<circle cx="-39" cy="22" r="3.5" fill="#58a6ff"/>
<circle cx="39" cy="22" r="3.5" fill="#bc8cff"/>
<!-- 三角形连线 -->
<line x1="0" y1="-45" x2="-39" y2="22" stroke="url(#blueGrad2)" stroke-width="1.5" opacity="0.7"/>
<line x1="-39" y1="22" x2="39" y2="22" stroke="url(#blueGrad2)" stroke-width="1.5" opacity="0.7"/>
<line x1="39" y1="22" x2="0" y2="-45" stroke="url(#blueGrad2)" stroke-width="1.5" opacity="0.7"/>
<!-- 中心点 -->
<circle cx="0" cy="0" r="2.5" fill="#58a6ff" opacity="0.6"/>
<!-- 辅助点 -->
<circle cx="-20" cy="-12" r="1.5" fill="#58a6ff" opacity="0.4"/>
<circle cx="20" cy="-12" r="1.5" fill="#bc8cff" opacity="0.4"/>
<circle cx="0" cy="22" r="1.5" fill="#58a6ff" opacity="0.4"/>
<!-- 辅助连线 -->
<line x1="0" y1="-45" x2="0" y2="0" stroke="#58a6ff" stroke-width="0.5" opacity="0.3"/>
<line x1="-39" y1="22" x2="0" y2="0" stroke="#58a6ff" stroke-width="0.5" opacity="0.3"/>
<line x1="39" y1="22" x2="0" y2="0" stroke="#bc8cff" stroke-width="0.5" opacity="0.3"/>
<!-- 文字 -->
<text x="0" y="80" fill="#e6edf3" font-size="24" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">PERSEUS</text>
<text x="0" y="100" fill="#8b949e" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" letter-spacing="2">MINIMAL</text>
</g>

<!-- Logo 5: 抽象星图风格 -->
<g transform="translate(400, 400)">
<circle cx="0" cy="0" r="80" fill="url(#glow)" opacity="0.5"/>
<!-- 主星点 -->
<circle cx="-35" cy="-30" r="3.5" fill="#58a6ff"/>
<circle cx="30" cy="-35" r="3" fill="#58a6ff"/>
<circle cx="40" cy="10" r="4" fill="url(#blueGrad1)"/>
<circle cx="10" cy="40" r="3" fill="#bc8cff"/>
<circle cx="-30" cy="35" r="3.5" fill="#58a6ff"/>
<circle cx="-45" cy="0" r="3" fill="#58a6ff"/>
<!-- 主连线 -->
<path d="M -35,-30 L 30,-35 L 40,10 L 10,40 L -30,35 L -45,0 Z" 
stroke="url(#blueGrad2)" stroke-width="1.2" fill="none" opacity="0.6"/>
<!-- 内部连线 -->
<line x1="-35" y1="-30" x2="40" y2="10" stroke="#58a6ff" stroke-width="0.8" opacity="0.3"/>
<line x1="30" y1="-35" x2="10" y2="40" stroke="#bc8cff" stroke-width="0.8" opacity="0.3"/>
<line x1="-45" y1="0" x2="40" y2="10" stroke="#58a6ff" stroke-width="0.8" opacity="0.3"/>
<!-- 装饰小点 -->
<circle cx="-10" cy="-15" r="1.5" fill="#58a6ff" opacity="0.5"/>
<circle cx="20" cy="-10" r="1.5" fill="#bc8cff" opacity="0.5"/>
<circle cx="5" cy="15" r="1.5" fill="#58a6ff" opacity="0.5"/>
<circle cx="-20" cy="10" r="1.5" fill="#58a6ff" opacity="0.5"/>
<!-- 文字 -->
<text x="0" y="80" fill="#e6edf3" font-size="24" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">PERSEUS</text>
<text x="0" y="100" fill="#8b949e" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" letter-spacing="2">STAR MAP</text>
</g>

<!-- Logo 6: 轨道风格 -->
<g transform="translate(650, 400)">
<circle cx="0" cy="0" r="80" fill="url(#glow)" opacity="0.5"/>
<!-- 中心星 -->
<circle cx="0" cy="0" r="5" fill="url(#blueGrad1)"/>
<!-- 轨道1 -->
<ellipse cx="0" cy="0" rx="50" ry="20" stroke="#58a6ff" stroke-width="0.8" fill="none" opacity="0.4" transform="rotate(-20)"/>
<circle cx="45" cy="-15" r="2.5" fill="#58a6ff"/>
<circle cx="-45" cy="15" r="2" fill="#58a6ff" opacity="0.6"/>
<!-- 轨道2 -->
<ellipse cx="0" cy="0" rx="40" ry="45" stroke="#bc8cff" stroke-width="0.8" fill="none" opacity="0.4" transform="rotate(30)"/>
<circle cx="20" cy="40" r="2.5" fill="#bc8cff"/>
<circle cx="-20" cy="-40" r="2" fill="#bc8cff" opacity="0.6"/>
<!-- 轨道3 -->
<ellipse cx="0" cy="0" rx="55" ry="30" stroke="#58a6ff" stroke-width="0.8" fill="none" opacity="0.3" transform="rotate(60)"/>
<circle cx="-30" cy="-45" r="2" fill="#58a6ff" opacity="0.5"/>
<circle cx="30" cy="45" r="2.5" fill="#58a6ff"/>
<!-- 外围小星 -->
<circle cx="60" cy="-30" r="1.5" fill="#58a6ff" opacity="0.3"/>
<circle cx="-55" cy="35" r="1.5" fill="#bc8cff" opacity="0.3"/>
<circle cx="50" cy="40" r="1.5" fill="#58a6ff" opacity="0.3"/>
<!-- 文字 -->
<text x="0" y="80" fill="#e6edf3" font-size="24" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">PERSEUS</text>
<text x="0" y="100" fill="#8b949e" font-size="11" font-family="Inter, sans-serif" text-anchor="middle" letter-spacing="2">ORBIT</text>
</g>

</svg>
