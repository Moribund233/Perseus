<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perseus</title>
    <style id="theme-vars">
/* Perseus Design Tokens - Dark Theme */
:root {
  /* Brand colors - Blue primary with purple accent */
  --perseus-primary: #1f6feb;
  --perseus-primary-foreground: #ffffff;
  --perseus-primary-light: #58a6ff;
  --perseus-primary-glow: #388bfd;
  --perseus-accent: #bc8cff;

  /* Surfaces */
  --perseus-background: #0d1117;
  --perseus-foreground: #e6edf3;
  --perseus-foreground-secondary: #8b949e;
  --perseus-foreground-tertiary: #6e7681;

  --perseus-card: #161b22;
  --perseus-card-foreground: #e6edf3;
  --perseus-elevated: #1c2128;

  --perseus-popover: #161b22;
  --perseus-popover-foreground: #e6edf3;

  /* Muted */
  --perseus-muted: #21262d;
  --perseus-muted-foreground: #8b949e;

  /* Borders */
  --perseus-border: #30363d;
  --perseus-border-light: #21262d;
  --perseus-input: #30363d;
  --perseus-ring: #1f6feb;

  /* Semantic state colors */
  --perseus-success: #3fb950;
  --perseus-success-foreground: #ffffff;
  --perseus-warning: #d29922;
  --perseus-warning-foreground: #ffffff;
  --perseus-destructive: #f85149;
  --perseus-destructive-foreground: #ffffff;

  /* Radius scale */
  --perseus-radius-sm: 6px;
  --perseus-radius-md: 10px;
  --perseus-radius-lg: 16px;
  --perseus-radius-xl: 20px;

  /* Typography */
  --perseus-font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --perseus-font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--perseus-background);
    --color-foreground: var(--perseus-foreground);
    --color-card: var(--perseus-card);
    --color-card-foreground: var(--perseus-card-foreground);
    --color-popover: var(--perseus-popover);
    --color-popover-foreground: var(--perseus-popover-foreground);
    --color-primary: var(--perseus-primary);
    --color-primary-foreground: var(--perseus-primary-foreground);
    --color-muted: var(--perseus-muted);
    --color-muted-foreground: var(--perseus-muted-foreground);
    --color-accent: var(--perseus-accent);
    --color-destructive: var(--perseus-destructive);
    --color-destructive-foreground: var(--perseus-destructive-foreground);
    --color-border: var(--perseus-border);
    --color-input: var(--perseus-input);
    --color-ring: var(--perseus-ring);
    --radius-sm: var(--perseus-radius-sm);
    --radius-md: var(--perseus-radius-md);
    --radius-lg: var(--perseus-radius-lg);
    --radius-xl: var(--perseus-radius-xl);
  }
  @layer base {
    body { background: var(--perseus-background); color: var(--perseus-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
