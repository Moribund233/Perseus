# =============================================================================
# Perseus 监控栈（可选）：Prometheus + Grafana
#
# 前置条件：已启动开发/生产 compose，随后：
#   docker compose -f docker-compose.monitoring.yml up -d
#
# 共享网络：默认加入生产网络 perseus-network；
# 若面向开发 compose，请在 .env 中设置 PERSEUS_NETWORK_NAME=perseus-dev-network。
#
# 访问：
#   - Prometheus: http://127.0.0.1:9090 (Targets → perseus)
#   - Grafana:    http://127.0.0.1:3000，或经网关同源子路径
#                 http://<部署机>:${PERSEUS_GATEWAY_PORT:-8000}/grafana
#                 （admin 控制台「打开 Grafana」一键 SSO 免登录；凭据由 .env
#                  注入 app → Grafana /api/login 换取会话 Cookie 下发浏览器）
#   - Grafana 登录: admin / ${GRAFANA_ADMIN_PASSWORD}（首次 .env 生成时自动创建）
#
# 告警规则: docker/prometheus/alerts.yml
#   - PerseusErrorRateHigh: 错误率 > 1% 持续 5 分钟（F-057）
#   - PerseusRequestLatencyHigh: P95 > 2s 持续 10 分钟
# =============================================================================

services:
  # Redis 指标导出（供 Prometheus 抓取；只读，仅暴露内存/客户端/命中率/淘汰等）
  # 应用层 worker/订阅健康由 /api/app/redis/status 提供，二者互补。
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: perseus-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "127.0.0.1:9121:9121"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - default

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: perseus-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - default

  grafana:
    image: grafana/grafana:11.4.0
    container_name: perseus-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 经网关 /grafana 同源子路径（serve_from_sub_path），供 admin 控制台 SSO
      GF_SERVER_ROOT_URL: "http://${PERSEUS_GATEWAY_HOST:-127.0.0.1}:${PERSEUS_GATEWAY_PORT:-8000}/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      # provisioning：Prometheus 数据源自动注入（docker/grafana/provisioning）
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - default

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    # 复用业务 compose 的共享网络（app 服务以此解析），确保 Prometheus 可达 app:8000
    name: ${PERSEUS_NETWORK_NAME:-perseus-network}
    driver: bridge